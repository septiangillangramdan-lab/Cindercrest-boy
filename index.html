<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cindercrest</title>
<link rel="icon" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Sora:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#07050d;--s1:#110c1d;--s2:#1a1230;--line:#2e2150;--p:#a855f7;--p2:#c084fc;--glow:#7c3aed;--tx:#ece6f8;--mu:#9a8fb8;--ok:#4ade80;--bad:#f87171;--r:4px}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx);font:400 15px/1.55 Sora,system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(60% 50% at 50% 0,#2a1259 0,transparent 70%),radial-gradient(40% 40% at 90% 90%,#1d0f3d 0,transparent 70%)}
h1,h2,h3,.px{font-family:'Pixelify Sans',monospace;font-weight:700;letter-spacing:.02em}
button,input,select,textarea{font:inherit;color:inherit}
.btn{cursor:pointer;border:2px solid var(--p);background:var(--s2);padding:.6em 1.3em;border-radius:var(--r);font-weight:600;box-shadow:4px 4px 0 var(--glow);transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--glow)}
.btn:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--glow)}
.btn.pri{background:var(--p);color:#12061f}
.btn.sm{padding:.3em .8em;font-size:13px;box-shadow:2px 2px 0 var(--glow)}
.btn.bad{border-color:var(--bad);box-shadow:2px 2px 0 #7f1d1d;color:var(--bad)}
.btn[disabled]{opacity:.5;pointer-events:none}
:focus-visible{outline:2px solid var(--p2);outline-offset:2px}
input,select,textarea{width:100%;background:#0c0816;border:1px solid var(--line);border-radius:var(--r);padding:.65em .8em}
input:focus,select:focus,textarea:focus{border-color:var(--p);outline:none;box-shadow:0 0 0 3px #a855f733}
label{display:block;font-size:13px;color:var(--mu);margin:14px 0 5px}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
.av{width:44px;height:44px;border-radius:var(--r);background:var(--s2);image-rendering:pixelated;flex:none;border:1px solid var(--line)}
.card{background:linear-gradient(180deg,var(--s2),var(--s1));border:1px solid var(--line);border-radius:6px;padding:16px}
.tag{font-size:12px;padding:2px 8px;border:1px solid var(--line);border-radius:99px;color:var(--p2)}
/* intro */
#intro{position:fixed;inset:0;z-index:99;background:var(--bg);display:grid;place-items:center;transition:opacity .8s,visibility .8s;cursor:pointer}
#intro.out{opacity:0;visibility:hidden}
#intro .box{text-align:center;position:relative}
#intro img{width:min(62vw,380px);animation:rise 1.6s cubic-bezier(.2,.8,.2,1) both,float 4s 1.6s ease-in-out infinite;filter:drop-shadow(0 0 40px #7c3aedaa)}
#intro h1{font-size:clamp(28px,7vw,54px);margin-top:10px;letter-spacing:.28em;animation:fade 1s 1.2s both}
#intro p{color:var(--mu);animation:fade 1s 1.8s both}
.ring{position:absolute;left:50%;top:42%;width:min(62vw,380px);aspect-ratio:1;border:2px solid var(--p);border-radius:50%;transform:translate(-50%,-50%) scale(.3);opacity:0;animation:ring 2s .4s ease-out 2}
.ember{position:fixed;bottom:-10px;width:6px;height:6px;background:var(--p2);box-shadow:0 0 8px var(--p);animation:up linear infinite;opacity:0;z-index:98;pointer-events:none}
@keyframes rise{from{opacity:0;transform:scale(.4) rotate(-8deg);filter:blur(14px) drop-shadow(0 0 0 #000)}to{opacity:1;transform:none}}
@keyframes float{50%{transform:translateY(-10px)}}
@keyframes fade{from{opacity:0;transform:translateY(10px)}}
@keyframes ring{0%{opacity:.8;transform:translate(-50%,-50%) scale(.4)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.6)}}
@keyframes up{0%{opacity:0;transform:translateY(0)}15%{opacity:.9}100%{opacity:0;transform:translateY(-110vh) translateX(var(--dx))}}
/* landing */
nav{display:flex;align-items:center;justify-content:space-between;padding:14px 0;gap:10px}
nav .brand{display:flex;align-items:center;gap:10px;font-size:22px}
nav img{width:42px}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center;padding:36px 0 60px}
.hero h1{font-size:clamp(40px,7vw,76px);line-height:1}
.hero p{color:var(--mu);max-width:46ch;margin:16px 0 26px}
.hero .acts{display:flex;gap:14px;flex-wrap:wrap}
.hero img{width:100%;max-width:440px;justify-self:center;animation:float 5s ease-in-out infinite;filter:drop-shadow(0 0 50px #7c3aed88)}
.sec{padding:30px 0 70px}
.sec h2{font-size:30px;margin-bottom:6px}
.sub{color:var(--mu);margin-bottom:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.mem{display:flex;gap:12px;align-items:center}
.mem b{display:block;font-weight:600}
.mem small{color:var(--mu)}
.rl{margin:26px 0 10px;font-size:18px;color:var(--p2)}
.rv{opacity:0;transform:translateY(18px);transition:opacity .6s,transform .6s}
.rv.in{opacity:1;transform:none}
/* modal */
.modal{position:fixed;inset:0;background:#000b;backdrop-filter:blur(6px);z-index:50;display:none;place-items:center;padding:16px;overflow:auto}
.modal.on{display:grid}
.modal .card{width:min(460px,100%);padding:24px;animation:pop .25s}
.modal h2{margin-bottom:4px}
@keyframes pop{from{opacity:0;transform:scale(.92) translateY(10px)}}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:10px}
/* app */
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 0;gap:10px;flex-wrap:wrap}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 24px;border-bottom:1px solid var(--line);padding-bottom:10px}
.tab{cursor:pointer;background:none;border:0;padding:.5em 1em;border-radius:var(--r);color:var(--mu);font-weight:600}
.tab.on{background:var(--s2);color:var(--tx);box-shadow:inset 0 -2px var(--p)}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.row:last-child{border:0}
.row .grow{flex:1;min-width:140px}
.pts{font-family:'Pixelify Sans';font-size:20px;color:var(--p2)}
.medal{width:28px;text-align:center;font-family:'Pixelify Sans';font-size:18px;color:var(--mu)}
.top1 .medal{color:#fbbf24}.top2 .medal{color:#d1d5db}.top3 .medal{color:#d9885a}
.done{color:var(--ok);font-weight:600}
.stack>*+*{margin-top:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--s2);border:1px solid var(--p);padding:10px 18px;border-radius:var(--r);z-index:80;animation:fade .3s}
.empty{color:var(--mu);padding:20px 0;text-align:center}
@media(max-width:760px){.hero{grid-template-columns:1fr;text-align:center}.hero p{margin-inline:auto}.hero .acts{justify-content:center}.hero img{order:-1;max-width:260px}.two{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important;transition:none!important}}
</style>
</head>
<body>
<div id="intro"><div class="ring"></div><div class="box"><img src="/logo.png" alt=""><h1>CINDERCREST</h1><p>Klik untuk lanjut</p></div></div>
<div id="root"></div>
<div id="modal" class="modal"></div>
<script>
const $=s=>document.querySelector(s), root=$('#root');
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ROLES=['ketua','tangan kanan','wakil','member'];
const RL={ketua:'Ketua','tangan kanan':'Tangan Kanan',wakil:'Wakil',member:'Member'};
const fmt=i=>i?new Date(i).toLocaleString('id-ID',{dateStyle:'medium',timeStyle:'short'}):'-';
const av=n=>`<img class="av" alt="" loading="lazy" src="https://mc-heads.net/avatar/${encodeURIComponent(n)}/64" onerror="this.style.visibility='hidden'">`;
async function api(p,body,tok){
  try{const r=await fetch('/api/'+p,{method:body?'POST':'GET',headers:{'content-type':'application/json',...(tok?{authorization:'Bearer '+tok}:{})},body:body?JSON.stringify(body):undefined});
  return await r.json();}catch{return{error:'Tidak bisa terhubung ke server.'}}
}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.append(d);setTimeout(()=>d.remove(),2600)}
function modal(html){const m=$('#modal');m.innerHTML=`<div class="card">${html}</div>`;m.classList.add('on');m.onclick=e=>{if(e.target===m)closeModal()}}
function closeModal(){$('#modal').classList.remove('on')}
function reveal(){const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add('in');io.unobserve(x.target)}}),{threshold:.1});document.querySelectorAll('.rv').forEach(e=>io.observe(e))}
function groups(ms){return ROLES.map(r=>({r,l:ms.filter(m=>m.role===r)})).filter(g=>g.l.length).map(g=>`<h3 class="rl rv">${RL[g.r]}</h3><div class="grid">${g.l.map(m=>`<div class="card mem rv">${av(m.nick)}<div><b>${E(m.nick)}</b><small>${E(m.edition)}</small></div></div>`).join('')}</div>`).join('')||'<p class="empty">Belum ada member. Jadilah yang pertama!</p>'}

/* ---------- INTRO ---------- */
function intro(){
  const el=$('#intro');
  if(sessionStorage.cc_intro){el.remove();return}
  for(let i=0;i<26;i++){const s=document.createElement('i');s.className='ember';s.style.cssText=`left:${Math.random()*100}%;--dx:${Math.random()*120-60}px;animation-duration:${3+Math.random()*4}s;animation-delay:${Math.random()*3}s`;el.append(s)}
  const end=()=>{sessionStorage.cc_intro=1;el.classList.add('out');setTimeout(()=>el.remove(),900)};
  el.onclick=end;setTimeout(end,4200);
}

/* ---------- PUBLIC SITE ---------- */
async function landing(){
  root.innerHTML=`<div class="wrap"><nav><div class="brand px"><img src="/logo.png" alt="">Cindercrest</div><div style="display:flex;gap:10px"><button class="btn sm" id="bl">Masuk</button><button class="btn sm pri" id="bd">Daftar</button></div></nav>
  <section class="hero"><div><h1>Cindercrest</h1><p>Tim Minecraft yang dibangun dari tangan-tangan yang saling bantu. Gabung, kumpulkan poin lewat absen, dan naik ke puncak leaderboard.</p><div class="acts"><button class="btn pri" id="hd">Daftar jadi member</button><button class="btn" id="hl">Masuk</button></div></div><img src="/logo.png" alt="Logo Cindercrest"></section>
  <section class="sec"><h2 class="px rv">Member Cindercrest</h2><p class="sub rv" id="cnt">Memuat…</p><div id="ml"></div></section></div>`;
  $('#bl').onclick=$('#hl').onclick=loginForm;$('#bd').onclick=$('#hd').onclick=regForm;
  const r=await api('public');const ms=r.members||[];
  $('#cnt').textContent=`${ms.length} anggota aktif`;$('#ml').innerHTML=groups(ms);reveal();
}
function regForm(){
  modal(`<h2 class="px">Daftar</h2><p class="sub">Admin akan meninjau pendaftaranmu.</p>
  <label>Nama asli</label><input id="rn" maxlength="60"><label>Nickname Minecraft</label><input id="rk" maxlength="20">
  <label>Pakai Minecraft</label><select id="re"><option>Java</option><option>Bedrock</option></select>
  <label>Alasan ingin bergabung</label><textarea id="ra" rows="3" maxlength="500"></textarea>
  <label>Nomor WhatsApp</label><input id="rw" inputmode="tel" placeholder="08xxxxxxxxxx">
  <div class="err" id="er"></div><button class="btn pri" id="go" style="width:100%">Kirim pendaftaran</button>`);
  $('#go').onclick=async()=>{const b=$('#go');b.disabled=true;
    const r=await api('register',{name:$('#rn').value,nick:$('#rk').value,edition:$('#re').value,reason:$('#ra').value,wa:$('#rw').value});
    if(r.error){$('#er').textContent=r.error;b.disabled=false;return}
    modal(`<h2 class="px">Terkirim!</h2><p class="sub">Tunggu admin menyetujui. Setelah diterima, masuk dengan nickname dan password default <b>212121</b>.</p><button class="btn pri" onclick="closeModal()">Oke</button>`)};
}
function loginForm(){
  modal(`<h2 class="px">Masuk</h2><label>Nickname Minecraft</label><input id="ln" autocomplete="username"><label>Password</label><input id="lp" type="password" autocomplete="current-password">
  <div class="err" id="er"></div><button class="btn pri" id="go" style="width:100%">Masuk</button>`);
  const go=async()=>{const r=await api('login',{nick:$('#ln').value,password:$('#lp').value});
    if(r.error){$('#er').textContent=r.error;return}
    localStorage.cc_tok=r.token;closeModal();member()};
  $('#go').onclick=go;$('#lp').onkeydown=e=>e.key==='Enter'&&go();$('#ln').focus();
}

/* ---------- MEMBER AREA ---------- */
let D,tab='anggota';
async function member(){
  const t=localStorage.cc_tok;if(!t)return landing();
  D=await api('me',null,t);
  if(D.error){delete localStorage.cc_tok;return landing()}
  drawMember();
}
function drawMember(){
  const tabs=[['anggota','Anggota'],['leaderboard','Leaderboard'],['info','Informasi'],['absen','Absen']];
  root.innerHTML=`<div class="wrap"><div class="top"><div class="brand px" style="display:flex;align-items:center;gap:10px;font-size:22px"><img src="/logo.png" width="40" alt="">Cindercrest</div>
  <div style="display:flex;align-items:center;gap:12px">${av(D.me.nick)}<div><b>${E(D.me.nick)}</b><br><small style="color:var(--mu)">${RL[D.me.role]} · <span class="pts" style="font-size:15px">${D.me.points}</span> poin</small></div><button class="btn sm" id="out">Keluar</button></div></div>
  <div class="tabs">${tabs.map(([k,l])=>`<button class="tab ${tab===k?'on':''}" data-t="${k}">${l}</button>`).join('')}</div><div id="tc"></div></div>`;
  $('#out').onclick=()=>{delete localStorage.cc_tok;landing()};
  document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.t;drawMember()});
  const c=$('#tc');
  if(tab==='anggota')c.innerHTML=groups(D.members);
  if(tab==='leaderboard'){const l=[...D.members].sort((a,b)=>b.points-a.points);
    c.innerHTML=`<div class="card">${l.map((m,i)=>`<div class="row top${i+1}"><span class="medal">${i+1}</span>${av(m.nick)}<div class="grow"><b>${E(m.nick)}</b><br><small style="color:var(--mu)">${E(m.name)}</small></div><span class="pts">${m.points}</span></div>`).join('')||'<p class="empty">Belum ada data.</p>'}</div>`}
  if(tab==='info')c.innerHTML=D.info.length?`<div class="stack">${D.info.map(i=>`<div class="card"><h3>${E(i.title)}</h3><small style="color:var(--mu)">${fmt(i.showAt)}</small><p style="margin-top:8px;white-space:pre-wrap">${E(i.body)}</p></div>`).join('')}</div>`:'<p class="empty">Belum ada informasi saat ini.</p>';
  if(tab==='absen')c.innerHTML=D.absen.length?`<div class="stack">${D.absen.map(a=>`<div class="card"><div class="row" style="border:0;padding:0"><div class="grow"><h3>${E(a.title)}</h3><small style="color:var(--mu)">${fmt(a.openAt)} – ${fmt(a.closeAt)} · +${a.points} poin · ${a.count} hadir</small></div>
    ${a.done?'<span class="done">Anda sudah absen</span>':a.status==='buka'?`<button class="btn pri" data-a="${a.id}">Hadir</button>`:`<span class="tag">${a.status==='belum'?'Belum dibuka':'Sudah ditutup'}</span>`}</div></div>`).join('')}</div>`:'<p class="empty">Belum ada sesi absen.</p>';
  c.querySelectorAll('[data-a]').forEach(b=>b.onclick=async()=>{b.disabled=true;const r=await api('attend',{id:b.dataset.a},localStorage.cc_tok);
    toast(r.error||'Absen berhasil! Poin ditambahkan.');member()});
}

/* ---------- ADMIN ---------- */
let A,at='pendaftar';
async function admin(){
  document.title='Admin · Cindercrest';
  const t=sessionStorage.cc_admin;
  if(!t){root.innerHTML=`<div class="wrap" style="max-width:420px;padding-top:12vh;text-align:center"><img src="/logo.png" width="120" alt=""><h1 class="px" style="margin:10px 0">Panel Admin</h1><div class="card" style="text-align:left"><label>Password admin</label><input id="ap" type="password"><div class="err" id="er"></div><button class="btn pri" id="go" style="width:100%">Masuk</button></div></div>`;
    const go=async()=>{const r=await api('admin/login',{password:$('#ap').value});if(r.error)return $('#er').textContent=r.error;sessionStorage.cc_admin=r.token;admin()};
    $('#go').onclick=go;$('#ap').onkeydown=e=>e.key==='Enter'&&go();return}
  A=await api('admin/data',null,t);
  if(A.error){delete sessionStorage.cc_admin;return admin()}
  drawAdmin();
}
async function adm(type,d={}){const r=await api('admin/do',{type,...d},sessionStorage.cc_admin);if(r.error)toast(r.error);else toast('Tersimpan');A=await api('admin/data',null,sessionStorage.cc_admin);drawAdmin()}
const iso=v=>v?new Date(v).toISOString():'';
function drawAdmin(){
  const tabs=[['pendaftar',`Pendaftar (${A.pending.length})`],['member','Member & Poin'],['info','Informasi'],['absen','Absen']];
  root.innerHTML=`<div class="wrap"><div class="top"><h1 class="px" style="font-size:26px">Panel Admin Cindercrest</h1><button class="btn sm" id="out">Keluar</button></div>
  <div class="tabs">${tabs.map(([k,l])=>`<button class="tab ${at===k?'on':''}" data-t="${k}">${l}</button>`).join('')}</div><div id="tc"></div></div>`;
  $('#out').onclick=()=>{delete sessionStorage.cc_admin;admin()};
  document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{at=b.dataset.t;drawAdmin()});
  const c=$('#tc');
  if(at==='pendaftar')c.innerHTML=`<div class="stack">${A.pending.map(p=>`<div class="card"><div class="row" style="border:0;padding:0"><div class="grow"><b>${E(p.nick)}</b> <span class="tag">${E(p.edition)}</span><br><small style="color:var(--mu)">${E(p.name)} · WA ${E(p.wa)}</small><p style="margin-top:6px">${E(p.reason)}</p></div>
    <button class="btn sm pri" data-do="accept" data-n="${E(p.nick)}">Terima</button><button class="btn sm bad" data-do="reject" data-n="${E(p.nick)}">Tolak</button></div></div>`).join('')||'<p class="empty">Tidak ada pendaftar baru.</p>'}</div>`;
  if(at==='member')c.innerHTML=`<div class="card"><h3>Tambah player</h3><div class="two"><div><label>Nickname</label><input id="mn"></div><div><label>Nama</label><input id="mm"></div><div><label>Edisi</label><select id="me"><option>Java</option><option>Bedrock</option></select></div><div><label>Role</label><select id="mr">${ROLES.map(r=>`<option value="${r}">${RL[r]}</option>`).join('')}</select></div></div><button class="btn sm pri" id="am" style="margin-top:14px">Tambah (password 212121)</button></div>
    <div class="card" style="margin-top:14px">${A.members.map(m=>`<div class="row">${av(m.nick)}<div class="grow"><b>${E(m.nick)}</b><br><small style="color:var(--mu)">${E(m.name)} · ${E(m.edition)} · WA ${E(m.wa||'-')}</small></div>
    <select data-role="${E(m.nick)}" style="width:auto">${ROLES.map(r=>`<option value="${r}" ${m.role===r?'selected':''}>${RL[r]}</option>`).join('')}</select>
    <input type="number" min="0" value="${m.points}" data-pt="${E(m.nick)}" style="width:90px"><button class="btn sm" data-do="resetPass" data-n="${E(m.nick)}">Reset pass</button><button class="btn sm bad" data-do="delMember" data-n="${E(m.nick)}">Hapus</button></div>`).join('')||'<p class="empty">Belum ada member.</p>'}</div>`;
  if(at==='info')c.innerHTML=`<div class="card"><h3>Tambah informasi</h3><label>Judul</label><input id="it"><label>Isi</label><textarea id="ib" rows="3"></textarea><div class="two"><div><label>Mulai tampil</label><input type="datetime-local" id="is"></div><div><label>Hapus otomatis (opsional)</label><input type="datetime-local" id="ih"></div></div><button class="btn sm pri" id="ai" style="margin-top:14px">Simpan informasi</button></div>
    <div class="card" style="margin-top:14px">${A.info.map(i=>`<div class="row"><div class="grow"><b>${E(i.title)}</b><br><small style="color:var(--mu)">Tampil ${fmt(i.showAt)} · Hilang ${fmt(i.hideAt)}</small></div><button class="btn sm bad" data-do="delInfo" data-id="${i.id}">Hapus</button></div>`).join('')||'<p class="empty">Belum ada informasi.</p>'}</div>`;
  if(at==='absen')c.innerHTML=`<div class="card"><h3>Buat sesi absen</h3><label>Judul</label><input id="ut" placeholder="Absen harian"><div class="two"><div><label>Buka</label><input type="datetime-local" id="uo"></div><div><label>Tutup</label><input type="datetime-local" id="uc"></div></div><label>Poin</label><input type="number" min="0" id="up" value="10"><button class="btn sm pri" id="aa" style="margin-top:14px">Simpan absen</button></div>
    <div class="card" style="margin-top:14px">${A.absen.map(a=>`<div class="row"><div class="grow"><b>${E(a.title)}</b> <span class="tag">+${a.points}</span><br><small style="color:var(--mu)">${fmt(a.openAt)} – ${fmt(a.closeAt)} · Hadir: ${a.attended.map(E).join(', ')||'-'}</small></div><button class="btn sm bad" data-do="delAbsen" data-id="${a.id}">Hapus</button></div>`).join('')||'<p class="empty">Belum ada sesi absen.</p>'}</div>`;
  c.querySelectorAll('[data-do]').forEach(b=>b.onclick=()=>{if(b.dataset.do.startsWith('del')&&!confirm('Yakin hapus?'))return;adm(b.dataset.do,{nick:b.dataset.n,id:b.dataset.id})});
  c.querySelectorAll('[data-role]').forEach(s=>s.onchange=()=>adm('setRole',{nick:s.dataset.role,role:s.value}));
  c.querySelectorAll('[data-pt]').forEach(s=>s.onchange=()=>adm('setPoints',{nick:s.dataset.pt,points:s.value}));
  const on=(id,f)=>{const e=$('#'+id);if(e)e.onclick=f};
  on('am',()=>adm('addMember',{nick:$('#mn').value,name:$('#mm').value,edition:$('#me').value,role:$('#mr').value}));
  on('ai',()=>adm('addInfo',{title:$('#it').value,body:$('#ib').value,showAt:iso($('#is').value),hideAt:iso($('#ih').value)}));
  on('aa',()=>adm('addAbsen',{title:$('#ut').value,openAt:iso($('#uo').value),closeAt:iso($('#uc').value),points:$('#up').value}));
}

/* ---------- START ---------- */
if(location.pathname.replace(/\/$/,'').startsWith('/adminpanelboy')){$('#intro').remove();admin()}
else{intro();localStorage.cc_tok?member():landing()}
</script>
