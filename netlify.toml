[build]
  publish = "site"
  functions = "netlify/functions"

# Panel admin: halaman dibuka lewat /adminpanelboy (folder site/adminpanelboy).
# Jangan diindeks mesin pencari & jangan di-cache.
[[headers]]
  for = "/adminpanelboy/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
