<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Panel Admin — Hallowed Sin</title>
<link rel="icon" href="/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap">
  <!-- login -->
  <div id="login" class="login card">
    <div style="text-align:center;margin-bottom:16px"><img src="/logo.png" alt="" width="90"></div>
    <h1 class="pix" style="font-size:14px;text-align:center;margin-bottom:18px">PANEL ADMIN</h1>
    <form id="loginForm">
      <label class="f">Password admin
        <input type="password" id="pw" autocomplete="current-password" required autofocus>
      </label>
      <div id="loginMsg" class="msg err hidden" role="alert"></div>
      <button class="btn" type="submit">Masuk</button>
    </form>
  </div>

  <!-- panel -->
  <div id="panel" class="hidden">
    <div class="row" style="padding:20px 0 0;justify-content:space-between">
      <div class="brand" style="font-size:13px"><img src="/logo.png" alt="" width="34" height="34">PANEL ADMIN</div>
      <div class="row"><a class="btn sec sm" href="/" target="_blank" rel="noopener">Lihat website</a><button class="btn sec sm" id="logout">Keluar</button></div>
    </div>
    <div class="tabs" id="tabs">
      <button class="tab on" data-t="apps">Pendaftar <span class="n" id="nApps">0</span></button>
      <button class="tab" data-t="rules">Peraturan & Syarat</button>
      <button class="tab" data-t="members">Member <span class="n" id="nMem">0</span></button>
    </div>

    <section id="t-apps" style="padding-top:0">
      <div class="row" style="margin-bottom:14px" id="filters"></div>
      <div class="apps" id="appList"></div>
    </section>

    <section id="t-rules" class="hidden" style="padding-top:0">
      <div class="card" style="display:grid;gap:16px">
        <label class="toggle"><input type="checkbox" id="open"> <span>Pendaftaran dibuka</span></label>
        <label class="f">Peraturan <small>(satu peraturan per baris)</small><textarea id="rulesTa" style="min-height:200px"></textarea></label>
        <label class="f">Syarat masuk <small>(satu syarat per baris)</small><textarea id="reqsTa" style="min-height:160px"></textarea></label>
        <div><button class="btn" id="saveSettings">Simpan</button></div>
      </div>
    </section>

    <section id="t-members" class="hidden" style="padding-top:0">
      <div class="card" style="margin-bottom:16px">
        <h3 class="pix">TAMBAH MEMBER</h3>
        <form class="row" id="addMember">
          <input type="text" id="mName" placeholder="Nama Minecraft" maxlength="32" required>
          <select id="mRole"></select>
          <button class="btn" type="submit">Tambah</button>
        </form>
      </div>
      <div class="apps" id="memList"></div>
    </section>
  </div>
</div>
<div id="toast" class="toast hidden"></div>
<script src="/adminpanelboy/panel.js"></script>
</body>
</html>
